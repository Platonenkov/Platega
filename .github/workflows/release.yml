name: Release

# Publishes to nuget.org when a version tag (v0.1.0) is pushed.
# Authentication uses NuGet Trusted Publishing (GitHub OIDC): no long-lived API key is stored.
# One-time setup: add a Trusted Publishing policy on nuget.org for this repository and workflow file,
# and set the repository secret NUGET_USER to the nuget.org profile name.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check that the tag matches VersionPrefix
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix="$(dotnet msbuild src/Platega.Client/Platega.Client.csproj -getProperty:VersionPrefix)"
          if [ "${version%%-*}" != "$prefix" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in src/Directory.Build.props" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Platega.slnx -c Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test tests/Platega.Client.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Platega.Client/Platega.Client.csproj -c Release --no-build -p:Version="$VERSION" -o artifacts
          dotnet pack src/Platega.Client.AspNetCore/Platega.Client.AspNetCore.csproj -c Release --no-build -p:Version="$VERSION" -o artifacts

      - name: NuGet login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
