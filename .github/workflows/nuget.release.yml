name: NuGet Release

# Every merge into main releases the version set in src/Directory.Build.props (<VersionPrefix>).
# Re-running is safe: pushes use --skip-duplicate and an existing GitHub release is left as is,
# so a merge without a version bump publishes nothing new.
# Authentication to nuget.org uses Trusted Publishing (GitHub OIDC): no long-lived API key is stored.
# One-time setup: a Trusted Publishing policy on nuget.org for this repository and workflow file
# nuget.release.yml, and the repository secret NUGET_USER set to the nuget.org profile name.

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Deliberately before the build: a missing CHANGELOG section fails the run while nothing
    # has been published yet, rather than after the push to nuget.org, which cannot be taken back
    # and whose version number cannot be reused.
    - name: Resolve version and release notes
      id: notes
      run: |
        set -euo pipefail

        version=$(awk 'match($0, /<VersionPrefix>[^<]+<\/VersionPrefix>/) {
                         s = substr($0, RSTART, RLENGTH)
                         sub(/<VersionPrefix>/, "", s)
                         sub(/<\/VersionPrefix>/, "", s)
                         print s
                         exit
                       }' src/Directory.Build.props)
        if [ -z "$version" ]; then
          echo "::error file=src/Directory.Build.props::No <VersionPrefix> found."
          exit 1
        fi

        # From the "## [<version>]" heading to the next "## [" heading or the link references.
        awk -v heading="## [$version]" '
          index($0, heading) == 1 { found = 1; next }
          found && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md

        if [ ! -s release-notes.md ]; then
          echo "::error file=CHANGELOG.md::No section headed '## [$version]' - add the release entry or fix the version."
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
        echo "Release v$version, $(wc -c < release-notes.md) characters of notes."

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Platega.slnx

    - name: Build
      run: dotnet build Platega.slnx --no-restore -c Release

    - name: Test
      run: dotnet test tests/Platega.Client.Tests --no-build -c Release

    - name: Pack
      run: |
        dotnet pack src/Platega.Client/Platega.Client.csproj -c Release --no-build -o artifacts
        dotnet pack src/Platega.Client.AspNetCore/Platega.Client.AspNetCore.csproj -c Release --no-build -o artifacts

    - name: Push to GitHub Packages
      run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -k ${{ secrets.GITHUB_TOKEN }}

    # Trusted Publishing: exchange the GitHub OIDC token for a short-lived nuget.org API key.
    # The key is valid for 1 hour, so this must stay immediately before the push step.
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet.org
      run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

    # Last, so a release only ever appears for packages that actually shipped.
    # Skips an existing release rather than failing, so a re-run can finish.
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.notes.outputs.tag }}
      run: |
        set -euo pipefail

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists - nothing to do."
          exit 0
        fi

        gh release create "$TAG" artifacts/* \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes-file release-notes.md

        echo "Created release $TAG."
