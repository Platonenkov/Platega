name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  merge_group:
  workflow_dispatch:

# New pushes to a PR cancel its in-flight run; push and merge-queue runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Platega.slnx

      - name: Build
        run: dotnet build Platega.slnx -c Release --no-restore

      - name: Test (net8.0 and net10.0)
        run: dotnet test tests/Platega.Client.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Platega.Client/Platega.Client.csproj -c Release --no-build -o artifacts
          dotnet pack src/Platega.Client.AspNetCore/Platega.Client.AspNetCore.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
